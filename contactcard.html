<!DOCTYPE html>
<html>
<head>
    <title>Company Contact Card</title>

    <style>
        body {
            margin: 0;
            background-color: lightgrey;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1;
            box-sizing: border-box;
        }
        .profile {
            width: 85%;
            height: 300px;
            background-color: white;
            margin: 100px auto 30px;
            padding: 25px;
            border: 2px solid black;
            border-radius: 10px;
            position: relative;
            overflow: auto;
            box-sizing: border-box;
        }
        .profile img {
            width: 150px;
            height: 150px;
            float: left;
            margin: 40px 25px 10px 10px;
            border-radius: 50%;
        }
        .details {
            text-align: center;
            padding-top: 25px;
            margin-right: 220px;
        }
        .contact {
            position: absolute;
            top: 50px;
            right: 20px;
            width: 190px;
            height: 180px;
            border-left: 3px solid darkblue;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .clear {
            clear: both;
        }

    </style>
</head>

<body>
    <header>
        Company Contact Card
    </header>
    <div class="profile">
        <img src="https://knightsdigital.org/website_media/2021/12/KontaktCards-700x686.png" alt="Employee Photo">

        <div class="details">

            <h2>KrishnaPriya</h2>

            <h3>Software Developer</h3>

            <p>
                KrishnaPriya is a dedicated software developer
                who works with our company. she has
                experience in developing websites and
                creating user-friendly applications.
            </p>

        </div>
        <div class="contact">

            <h3>Contact Info</h3>

            <p>Phone: 81765432821</p>

            <p>Email: krishna@gmail.com</p>

        </div>

        <div class="clear"></div>

    </div>

</body>
</html>
