<!DOCTYPE html>
<html>
<head>    
<title>Product Card</title>
<style>
    body {
        background-color:grey;
        font-family: Arial, sans-serif;
    }
    .card {
        width: 90%;
        max-width: 350px;
        height: 400px;
        border: 2px solid black;
        border-radius: 15px;
        margin: 30px auto;
        padding: 15px;
        background-color: white;
        box-sizing: border-box;
    }
    img {
        max-width: 100%;
        min-width: 200px;
        height: 180px;
        display: block;
        margin: auto;
    }
    h2 {
        text-align: center;
        color: purple;
    }
    p {
        text-align: center;
        font-size: 15px;
    }

</style>
</head>
<body>
<div class="card">
    <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/airpods-max-select-202409-starlight_FV1?wid=976&hei=916&fmt=jpeg&qlt=90&.v=azQxRkVJKzd6V3J0aGNqWFhLMzBmdWd1NjlYUXFPTDZEK2xySGJScW1PS1Rpbjg5MjlaRWkwN0JTZEtNR2p3b2dmcFJCOTlLWlREUEJzL3lTN2VnL0cvVnNUQWxFNHNrME94a1pxdUNOU29FM01jakdGSHhMVXhHQ21YeXBIKzU" alt="Wireless Headphone">
    <h2>AirPods Max</h2>
    <p>
        Enjoy high-quality sound with comfortable
        wireless headphones. Perfect for music,
        movies and everyday use.
    </p>
</div>
</body>
</html>
